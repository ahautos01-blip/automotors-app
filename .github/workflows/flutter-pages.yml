name: Build and deploy Flutter web

on:
  # Rebuild on every main-branch commit so changes to app configuration,
  # migrations, or supporting files cannot leave Pages serving an old bundle.
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build web app
        run: flutter build web --release --base-href /automotors-app/

      - name: Bust cache for each published build
        run: |
          sed -i "s/main.dart.js\\"/main.dart.js?v=${GITHUB_SHA}\\"/g" build/web/flutter_bootstrap.js
          sed -i "s/flutter_bootstrap.js\\"/flutter_bootstrap.js?v=${GITHUB_SHA}\\"/g" build/web/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
